<style>
:root{--nude:#FFF8F5;--rosa:#C8656D;--rojo:#B04555;--gris:#3F3435;--suave:#7A6A6B;--linea:#EBD6D1;--blanco:#FFFFFF;
--display:"Libre Bodoni","Bodoni 72",Didot,Georgia,serif;--texto:"Montserrat","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--nude);color:var(--gris);font-family:var(--texto);min-height:100vh;display:grid;place-items:center;padding:48px 20px}
main{width:100%;max-width:420px;display:grid;justify-items:center;text-align:center;gap:14px}
.logo{width:92px;height:92px;border-radius:50%;background:var(--blanco);border:1px solid var(--linea);display:grid;place-items:center}
.logo img{width:44px;height:auto}
h1{font-family:var(--display);font-weight:400;color:var(--rojo);font-size:2.6rem;margin:6px 0 0;line-height:1}
.bio{margin:0;color:var(--suave);font-size:.95rem;line-height:1.5}
.eyebrow{font-size:.68rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--rosa);margin:0}
nav{width:100%;display:grid;gap:12px;margin-top:14px}
a.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--rosa);color:var(--rosa);background:var(--blanco);transition:background .2s,color .2s}
a.btn:hover,a.btn:focus-visible{background:var(--rosa);color:var(--blanco);outline:none}
a.btn.main{background:var(--rosa);color:var(--blanco)}
a.btn.main:hover,a.btn.main:focus-visible{background:var(--rojo);border-color:var(--rojo)}
a.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
footer{margin-top:22px;font-size:.75rem;color:var(--suave)}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
